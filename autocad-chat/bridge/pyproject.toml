[project]
name = "autocad-chat-bridge"
version = "1.0.0"
description = "The chat engine behind the Claude panel for AutoCAD: Claude on one side, AutoCAD MCP Pro on the other."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.11,<3",
    "fastmcp>=3.4,<4",
    "autocad-mcp-pro[com,pdf,office]==1.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
autocad-chat-bridge = "autocad_chat_bridge.__main__:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocad_chat_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
